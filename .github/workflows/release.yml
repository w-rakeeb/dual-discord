name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag matching the source, for example v2.1.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and build
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $source = Get-Content Source/UpdateService.cs -Raw
          $version = [regex]::Match($source, 'CurrentVersion="([0-9.]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match CurrentVersion.' }
          ./Tests/Run.ps1
          ./Source/Build.ps1
          ./Tests/RunIntegration.ps1
          ./Source/Package.ps1
      - name: Publish clean package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG Release/Dual-Discord-Windows.zip Release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Dual Discord $env:RELEASE_TAG" --generate-notes
